name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun can drop the exec bit on @effect/tsgo's prebuilt platform binary;
      # restore it so check:effect and tsgo-backed type-aware linting can run.
      - name: Restore effect-tsgo exec bit
        run: chmod +x node_modules/@effect/tsgo-*/lib/tsc || true

      - name: Typecheck (TypeScript 7)
        run: bun run typecheck

      - name: Effect diagnostics (effect-tsgo)
        run: bun run check:effect

      - name: Lint (oxlint, type-aware)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run format:check

      - name: Test (vitest)
        run: bun run test

      - name: Build (tsc + vite)
        run: bun run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: grill:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Release

# Publishes grill to npm when a v* tag is pushed. Requires the NPM_TOKEN secret;
# the job is a no-op-safe scaffold until that secret is configured.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore effect-tsgo exec bit
        run: chmod +x node_modules/@effect/tsgo-*/lib/tsc || true

      - name: Verify
        run: |
          bun run typecheck
          bun run test
          bun run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
